spring:
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_SMTP_USERNAME}
    password: ${BREVO_SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  datasource:
#    url: "jdbc:postgresql://localhost:5433/hola"
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:holamd_dev_db}"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: AppointmentAgentPool
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000          # 5 min - close idle connections beyond minimum-idle
      max-lifetime: 1800000         # 30 min - recycle connections before DB/infra kills them
      connection-timeout: 30000     # 30 sec - fail fast if pool is exhausted
      validation-timeout: 5000
      leak-detection-threshold: 60000   # warn if a connection is held > 60s
  jpa:
    # Ensures compatibility across PostgreSQL versions
#    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update            # Auto-creates/updates tables in holamd_dev_db
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
          batch_size: 25

  sql:
    init:
      mode: never                   # Disable default Spring SQL init


server:
  port: 8080

# Moved to root level (was incorrectly nested under 'app')
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.jfl.appointment: DEBUG
    com.zaxxer.hikari: INFO

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_TOKEN_EXP:3600000}

app:
  encryption:
    key: ${APP_ENCRYPTION_KEY}
  qr:
    base-url: ${QR_BASE_URL:http://localhost:5173}
    width: 400
    height: 400

hola:
  app:
    hola-md-base-url: ${HOLA_MD_BASE_URL:http://localhost:8080}
    hola-md-app-base-url: ${HOLA_MD_APP_BASE_URL:https://submitting-coupons-programme-kept.trycloudflare.com}
  booking:
    max-success-per-phone-per-clinic-per-day: ${MAX_SUCCESS_PER_PHONE_PER_CLINIC_PER_DAY:3}
    max-attempts-per-phone-per-10-min: ${MAX_ATTEMPTS_PER_PHONE_PER_10_MIN:5}
    session-ttl-minutes: ${SESSION_TTL_MINUTES:30}
    max-success-per-session: ${MAX_SUCCESS_PER_SESSION:1}
  admin:
    username: ${ADMIN_USERNAME}
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    first-name: ${ADMIN_FIRSTNAME}
    last-name: ${ADMIN_LASTNAME}