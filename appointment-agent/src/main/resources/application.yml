spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:appointment}
#    url: jdbc:postgresql://localhost:5432/appointment_agent
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    hikari:
      pool-name: AppointmentAgentPool
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000          # 5 min - close idle connections beyond minimum-idle
      max-lifetime: 1800000         # 30 min - recycle connections before DB/infra kills them
      connection-timeout: 30000     # 30 sec - fail fast if pool is exhausted
      validation-timeout: 5000
      leak-detection-threshold: 60000   # warn if a connection is held > 60s (dev/debug aid)
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: update   # schema is owned by schema.sql / migrations, not Hibernate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 25             # optional: pairs well with pooling for bulk writes

  sql:
    init:
      mode: never          # we run schema.sql manually / via flyway later, not on every boot

server:
  port: 8080

logging:
  level:
    com.jfl.appointment: DEBUG
    com.zaxxer.hikari: INFO        # set to DEBUG temporarily if you need pool diagnostics

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_TOKEN_EXP:3600000}


meta:
  app-id: ${META_APP_ID:235569knknknhkh}
  app-secret: ${META_APP_SECRET:54gjgcfdjgkgkgkgfjfj}
  graph-api-url: https://graph.facebook.com/v20.0

app:
  encryption:
    key: ${APP_ENCRYPTION_KEY}
  qr:
    base-url: http://localhost:5173
    width: 400
    height: 400


  management:
    endpoints:
      web:
        exposure:
          include: health

    endpoint:
      health:
        show-details: never