services:

  postgres:
    image: postgres:16
    container_name: appointment-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: appointment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - appointment-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appointment"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  backend:
    build: .
    container_name: appointment-backend
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: prod

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: appointment
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"

    networks:
      - appointment-network


  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: appointment-n8n
    restart: unless-stopped

    environment:
      # Local n8n configuration
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_PORT: 5678

      # Used for webhook URLs
      WEBHOOK_URL: http://localhost:5678/

      # Used for the n8n editor
      N8N_EDITOR_BASE_URL: http://localhost:5678/

      # n8n encryption key
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"

      # Spring Boot backend
      SPRING_BOOT_BASE_URL: http://backend:8080

    volumes:
      - n8n_data:/home/node/.n8n

    ports:
      - "5678:5678"

    networks:
      - appointment-network


volumes:
  postgres_data:
  n8n_data:


networks:
  appointment-network:
    driver: bridge